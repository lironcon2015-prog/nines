<script>
/* ערכת הצבעים לפני הציור הראשון — אחרת מי שבחר כהה רואה הבזק בהיר בכל פתיחה.

try { if (localStorage.getItem('k8:theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs><linearGradient id="gold-fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2CB55"/><stop offset="1" stop-color="#DDAA22"/></linearGradient></defs>

  <symbol id="i-next" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></symbol>
  <symbol id="i-bowl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
  <symbol id="i-watch" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M9 2h6"/></symbol>
  <symbol id="i-cup" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></symbol>

  <symbol id="i-shrink" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></symbol>
  <symbol id="i-ff" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6l8 6-8 6zM12 6l8 6-8 6z"/></symbol>
  <symbol id="i-back10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 1 0 2.1-5"/><path d="M7 3v4h4"/></symbol>
  <symbol id="i-fwd10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M17 3v4h-4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-clip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></symbol>
  <symbol id="i-pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
  <symbol id="i-ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="7.5" r="1.3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="4" y="4" width="7" height="8" rx="2"/><rect x="13" y="4" width="7" height="8" rx="2"/><rect x="4" y="14" width="7" height="6" rx="2"/><rect x="13" y="14" width="7" height="6" rx="2"/></symbol>
  <symbol id="i-rows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="5" height="5" rx="1.5"/><rect x="4" y="14" width="5" height="5" rx="1.5"/><path d="M12 7h8M12 16h8"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-sync" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.5 4.5L20 16M20 20v-4h-4"/></symbol>
  <symbol id="i-cloud" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.5 4.5 0 0 1-.5-9 6 6 0 0 1 11.6 1.5A3.8 3.8 0 0 1 17.5 18Z"/></symbol>
</svg>

<div class="wrap">

  <div class="state" id="state">טוען…</div>

  <!-- ===== מסך הבית ===== -->
  <section id="library" hidden>
    <header class="top">
      <div class="crest"><span id="lib-crest"><svg class="i"><use href="#i-cone"/></svg></span></div>
      <div class="top-text"><h1 id="lib-title"></h1><p id="lib-eyebrow"></p></div>
      <a class="icon-btn" href="#/s" aria-label="הגדרות וסנכרון"><svg class="i"><use href="#i-gear"/></svg></a>
    </header>
    <p class="lede" id="lib-lede"></p>

    <div class="me" id="me" hidden></div>

    <!-- החבילה המלאה. מסך הטעינה כשאין תוכן במכשיר, ושורת החלפה כשיש. -->
    <div class="pack" id="pack" hidden>
      <p class="pack-t" id="pack-t"></p>
      <p class="pack-d" id="pack-d"></p>
      <div class="pack-do" id="pack-do">
        <label class="pack-file" for="pack-input" id="pack-filelbl">בחר קובץ חבילה</label>
        <input type="file" id="pack-input" accept=".json,application/json">
        <button type="button" id="pack-urlgo">או מכתובת</button>
      </div>
      <form class="pack-url" id="pack-urlrow" hidden novalidate>
        <input type="url" id="pack-url" inputmode="url" autocomplete="off" placeholder="https://…/pack/all.json">
        <button type="submit" id="pack-load">טען</button>
      </form>
      <p class="verror" id="pack-error" hidden></p>
      <button type="button" class="pack-drop" id="pack-drop" hidden>הסר את החבילה מהמכשיר</button>
    </div>

    <button id="install" type="button">התקן את האפליקציה על המסך</button>

    <!-- התפקיד שנבחר: כרטיס אחד גדול. או הבוחר, כשעוד לא נבחר מספר. -->
    <div id="hero"></div>

    <!-- התרחישים של התפקיד שלך -->
    <div id="scenlist"></div>

    <!-- וכל השאר, מקופל -->
    <details class="roles" id="roles" hidden>
      <summary id="roles-sum">ספריית התפקידים</summary>
      <div class="rolelist" id="rolelist"></div>
    </details>

    <p class="foot"><span id="lib-foot"></span><span class="ver" id="lib-ver"></span></p>
  </section>

  <!-- ===== מסך חוברת: מסך אחד, המגרש וההנחיות יחד =====
       ממלא את המסך כולו: כותרת, מגרש, שורת שליטה והנחיות. הפריסה לרוחב
       (טלפון מסובב, טאבלט, מחשב) מסודרת ב-CSS מאותו סימון. -->
  <section id="booklet" class="bk" hidden>
    <header class="bk-head">
      <a class="ic" href="#/" id="back" aria-label="חזרה למסך הבית"><svg class="i"><use href="#i-x"/></svg></a>
      <!-- השם הוא הכפתור לרשימת התרחישים — במקום שורת הצ'יפים, פס ההתקדמות ומתג הצד -->
      <button class="ttl" id="b-ttl" type="button" aria-haspopup="dialog">
        <b><span id="b-title"></span><i class="ok" id="b-ok" hidden>✓</i><svg class="i caret"><use href="#i-down"/></svg></b>
        <small id="b-phase"></small>
      </button>
      <div class="bk-nav" id="b-nav">
        <button class="ic" id="prev" type="button" aria-label="התרחיש הקודם"><svg class="i"><use href="#i-prev"/></svg></button>
        <span class="num" id="b-num"></span>
        <button class="ic" id="next" type="button" aria-label="התרחיש הבא"><svg class="i"><use href="#i-next"/></svg></button>
      </div>
    </header>

    <!-- המגרש, ועליו כפתור המצלמה ובחירת האפשרות — נבנים ב-board.js -->
    <div class="bk-stage" id="board"></div>
    <!-- ▶, הכיתוב, ציר הזמן ו"איטי" — ליד האגודל -->
    <div class="ctl" id="b-ctl"></div>

    <!-- ההנחיות: כרטיס אחד בכל פעם, או הכול ברשימה -->
    <div class="guide" id="guide">
      <button class="handle" id="g-handle" type="button" aria-expanded="false" aria-controls="g-list"><i></i><span id="g-handle-t"></span></button>
      <div class="cards-wrap"><div class="cards" id="g-cards"></div><div class="dots" id="g-dots"></div></div>
      <div class="list" id="g-list"></div>
    </div>
  </section>

  <!-- ===== מסך מבדק ===== -->
  <section id="quiz" hidden>
    <a class="back" href="#/" id="q-back"><svg class="i"><use href="#i-back"/></svg>בית</a>
    <div class="eyebrow" id="q-eyebrow"></div>

    <div class="track" id="q-track" aria-hidden="true"></div>
    <div class="count" id="q-count"></div>

    <div id="q-stage">
      <div class="phase" id="q-context"></div>
      <h2 id="q-ask"></h2>

      <div class="board" id="q-board"></div>
      <p class="hint" id="q-hint">גע במגרש במקום שבו אתה צריך להיות</p>

      <div class="qfeed" id="q-feed" hidden></div>
      <div class="qchoices" id="q-choices" hidden></div>

      <div class="dock glass"><button class="d go" id="q-confirm" type="button">זהו, זה המקום</button></div>
    </div>

    <div id="q-result" class="card" hidden></div>
  </section>

  <!-- ===== הסרטונים, הקטגוריות וההגדרות — אותם מסכים כמו בספריית המתכונים ===== -->
  <section id="videos" hidden></section>
  <section id="vcats" hidden></section>
  <section id="plan" hidden></section>
  <section id="share" hidden></section>

</div>

<nav class="tabbar glass" id="tabbar" hidden>
  <a id="tab-home" href="#/"><svg class="i"><use href="#i-home"/></svg><span>בית</span></a>
  <a id="tab-book" href="#/"><svg class="i"><use href="#i-book"/></svg><span>חוברת</span></a>
  <a id="tab-quiz" href="#/"><svg class="i"><use href="#i-quiz"/></svg><span>מבדק</span></a>
  <a id="tab-vid" href="#/v"><svg class="i"><use href="#i-vid"/></svg><span>סרטונים</span></a>
</nav>
<button class="fab glass" id="fab" type="button" hidden><svg class="i"><use href="#i-plus"/></svg>סרטון</button>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
